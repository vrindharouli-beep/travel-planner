
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Trip | Travel Planner</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<nav class="navbar">
    <a class="brand" th:href="@{/}">✈ Travel<span>Planner</span></a>
    <div class="nav-links">
        <a th:href="@{/}">Home</a>
        <a th:href="@{/trips}">My Trips</a>
    </div>
</nav>

<header class="form-banner">
    <h1>✎ Edit Trip</h1>
    <p>Update your trip details below.</p>
</header>

<main>
    <form class="form-card"
          th:action="@{/trips/update/{id}(id=${trip.id})}"
          th:object="${trip}" method="post">

        <h2>Update Your Travel Plan</h2>

        <div class="form-group">
            <label for="title">Trip Title</label>
            <input id="title" type="text" th:field="*{title}" required>
        </div>

        <div class="form-group">
            <label for="destination">Destination</label>
            <input id="destination" type="text"
                   th:field="*{destination}" required>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="startDate">Start Date</label>
                <input id="startDate" type="date"
                       th:field="*{startDate}" required>
            </div>

            <div class="form-group">
                <label for="endDate">End Date</label>
                <input id="endDate" type="date"
                       th:field="*{endDate}" required>
            </div>
        </div>

        <div class="form-group">
            <label for="budget">Budget (INR ₹)</label>
            <input id="budget" type="number" min="0" step="0.01"
                   th:field="*{budget}" required>
        </div>

        <div class="form-actions">
            <button class="btn btn-blue" type="submit">✎ Update Trip</button>
            <a class="btn btn-light" th:href="@{/trips}">← Cancel</a>
        </div>

    </form>
</main>

<footer class="footer">Every journey deserves a great plan.</footer>

</body>
</html>
